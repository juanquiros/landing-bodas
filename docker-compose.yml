services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: karina-y-mario-landing:latest
    container_name: karina-y-mario-landing
    restart: unless-stopped
    env_file:
      - .env
    # Dedicated loopback port: Nginx lives on the VPS host and is the only
    # public entry point. Change both this port and proxy_pass together if it
    # is already used by another local service.
    ports:
      - "127.0.0.1:3107:3000"
    volumes:
      - wedding_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  wedding_data:
