services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: karina-y-mario-landing:latest
    container_name: karina-y-mario-landing
    restart: unless-stopped
    # Dedicated loopback port: Nginx lives on the VPS host and is the only
    # public entry point. Change both this port and proxy_pass together if it
    # is already used by another local service.
    ports:
      - "127.0.0.1:3107:3000"
    volumes:
      - landing-worker-state:/app/.wrangler/state

volumes:
  landing-worker-state:
